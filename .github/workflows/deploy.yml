name: Build & Deploy

# Build 12 image, đẩy lên ghcr.io, rồi SSH vào VPS kéo về chạy.
# Hiện chỉ chạy khi bấm tay (Actions → Build & Deploy → Run workflow), vì đang deploy bằng cách build trên VPS
# (deploy/build.sh). Muốn tự deploy khi push main: thêm lại `push: branches: [main]` và 3 secret
# VPS_HOST, VPS_USER, VPS_SSH_KEY (xem deploy/README.md, mục "Cách B").
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Tên image trên ghcr.io phải viết thường.
  REGISTRY: ghcr.io/thanhduongw/ats

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - auth-service
          - masterdata-service
          - recruitment-service
          - candidate-service
          - interview-service
          - notification-service
          - dashboard-service
          - application-service
          - offer-service
          - api-gateway
          - ai-service
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Chép cấu hình lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/Caddyfile,deploy/start.sh,deploy/backup.sh,deploy/.env.example,docker/postgres-init/init-databases.sql"
          target: "~/ats"

      - name: Kéo image và khởi động lại
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,TAG
          command_timeout: 40m
          script: |
            set -e
            cd ~/ats
            test -f .env || { echo "Thiếu ~/ats/.env — xem deploy/README.md bước 4"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export TAG
            bash deploy/start.sh
            docker logout ghcr.io
            echo "$TAG" > .deployed_tag
