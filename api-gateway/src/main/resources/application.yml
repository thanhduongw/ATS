server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: masterdata-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/masterdata/**

        - id: recruitment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/recruitment/**

        - id: candidate-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/candidate/**

        - id: interview-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/interview/**

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/notification/**

        - id: dashboard-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/dashboard/**

        - id: application-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/application/**

        - id: offer-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/offer/**

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: masterdata-service
        url: /api/masterdata/v3/api-docs
      - name: recruitment-service
        url: /api/recruitment/v3/api-docs
      - name: candidate-service
        url: /api/candidate/v3/api-docs
      - name: interview-service
        url: /api/interview/v3/api-docs
      - name: notification-service
        url: /api/notification/v3/api-docs
      - name: dashboard-service
        url: /api/dashboard/v3/api-docs
      - name: application-service
        url: /api/application/v3/api-docs
      - name: offer-service
        url: /api/offer/v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:thay-bang-chuoi-bi-mat-it-nhat-256-bit-truoc-khi-deploy-thuc-te}