server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Route URI là nguồn duy nhất: mặc định localhost cho chạy ngoài Docker,
      # docker-compose chỉ cần set SERVICES_*_URL sang DNS service-name.
      # KHÔNG khai báo StripPrefix — downstream nhận nguyên path /api/<service>/**.
      routes:
        - id: auth-service
          uri: ${SERVICES_AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: masterdata-service
          uri: ${SERVICES_MASTERDATA_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/masterdata/**

        - id: recruitment-service
          uri: ${SERVICES_RECRUITMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/recruitment/**

        - id: candidate-service
          uri: ${SERVICES_CANDIDATE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/candidate/**

        - id: interview-service
          uri: ${SERVICES_INTERVIEW_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/interview/**

        - id: notification-service
          uri: ${SERVICES_NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notification/**

        - id: dashboard-service
          uri: ${SERVICES_DASHBOARD_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/dashboard/**

        - id: application-service
          uri: ${SERVICES_APPLICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/application/**

        - id: offer-service
          uri: ${SERVICES_OFFER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/offer/**

        - id: ai-service
          uri: ${SERVICES_AI_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/ai/**

        # SockJS/STOMP của notification-service. Dùng lại đúng URL notification-service ở trên.
        # Spring Cloud Gateway tự đổi scheme http -> ws khi request là WebSocket upgrade
        # (WebsocketRoutingFilter); handshake SockJS dạng HTTP (/ws/info, xhr_*) đi cùng route này.
        - id: notification-websocket
          uri: ${SERVICES_NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/ws/**

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: masterdata-service
        url: /api/masterdata/v3/api-docs
      - name: recruitment-service
        url: /api/recruitment/v3/api-docs
      - name: candidate-service
        url: /api/candidate/v3/api-docs
      - name: interview-service
        url: /api/interview/v3/api-docs
      - name: notification-service
        url: /api/notification/v3/api-docs
      - name: dashboard-service
        url: /api/dashboard/v3/api-docs
      - name: application-service
        url: /api/application/v3/api-docs
      - name: offer-service
        url: /api/offer/v3/api-docs
      - name: ai-service
        url: /api/v1/ai/openapi.json

app:
  jwt:
    secret: ${JWT_SECRET:thay-bang-chuoi-bi-mat-it-nhat-256-bit-truoc-khi-deploy-thuc-te}
