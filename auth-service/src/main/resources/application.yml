server:
  port: 8081
  # Chay sau nginx + api-gateway: dung X-Forwarded-* de sendRedirect va session cookie
  # sinh ra theo origin cong khai, khong phai http://auth-service:8081.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_auth
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password
app:
  jwt:
    secret: ${JWT_SECRET:thay-bang-chuoi-bi-mat-it-nhat-256-bit-truoc-khi-deploy-thuc-te}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  otp:
    expiration-minutes: 10
  mail:
    log-otp-on-failure: ${MAIL_LOG_OTP_ON_FAILURE:false}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Google SSO — để trống thì tính năng "Đăng nhập bằng Google" tự tắt, không ảnh hưởng khởi động service
  # (cố ý KHÔNG khai báo dưới spring.security.oauth2.client.registration.* — property đó bắt buộc
  # client-id non-blank, để trống sẽ làm service crash lúc start).
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # De trong => suy ra tu request ({baseUrl}/api/auth/login/oauth2/code/google).
    # Set tuyet doi de khong phu thuoc header proxy; phai khop Authorized redirect URI
    # khai bao trong Google Cloud Console.
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

services:
  masterdata-service:
    url: ${SERVICES_MASTERDATA_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
