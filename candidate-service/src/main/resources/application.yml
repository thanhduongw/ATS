server:
  port: 8084

spring:
  application:
    name: candidate-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_candidate
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

services:
  auth-service:
    url: ${SERVICES_AUTH_SERVICE_URL:http://localhost:8081}
  masterdata-service:
    url: ${SERVICES_MASTERDATA_SERVICE_URL:http://localhost:8082}
  recruitment-service:
    url: ${SERVICES_RECRUITMENT_SERVICE_URL:http://localhost:8083}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ats-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:}
  access-key-id: ${AWS_ACCESS_KEY_ID:minioadmin}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}