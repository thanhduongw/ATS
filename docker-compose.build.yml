# Bổ sung cho docker-compose.prod.yml khi build image ngay trên VPS (không dùng GitHub Actions).
# Image build xong mang đúng tên mà docker-compose.prod.yml dùng, nên chạy lại chỉ cần file prod.
#
#   bash deploy/build.sh      # build lần lượt từng service rồi khởi động (xem deploy/README.md)
services:
  auth-service:         { build: ./auth-service }
  masterdata-service:   { build: ./masterdata-service }
  recruitment-service:  { build: ./recruitment-service }
  candidate-service:    { build: ./candidate-service }
  interview-service:    { build: ./interview-service }
  notification-service: { build: ./notification-service }
  dashboard-service:    { build: ./dashboard-service }
  application-service:  { build: ./application-service }
  offer-service:        { build: ./offer-service }
  api-gateway:          { build: ./api-gateway }
  ai-service:           { build: ./ai-service }
  frontend:             { build: ./frontend }
