# ============================================================
# Production stack cho VPS. Image do GitHub Actions build sẵn trên ghcr.io
# (.github/workflows/deploy.yml), VPS chỉ pull về chạy — không build ở đây.
#
#   docker compose -f docker-compose.prod.yml up -d      (hoặc deploy/start.sh)
#
# Biến lấy từ file .env cạnh file này (mẫu: deploy/.env.example).
# Chỉ Caddy mở cổng 80/443 ra ngoài; DB, RabbitMQ, Redis, gateway không publish cổng
# (Docker ghi iptables bỏ qua UFW, publish là lộ ra Internet).
# docker-compose.yml vẫn dùng để chạy/build ở máy dev.
# ============================================================

x-java-service: &java-service
  restart: unless-stopped
  networks: [ats-network]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_started }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-java-env: &java-env
  TZ: Asia/Ho_Chi_Minh
  # Giới hạn heap để 10 JVM vừa máy 8 GB. Tăng JAVA_MAX_HEAP trong .env nếu VPS rộng hơn.
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_MAX_HEAP:-384m} -XX:MaxMetaspaceSize=192m -Xss512k -XX:+UseSerialGC -Duser.timezone=Asia/Ho_Chi_Minh"
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER chưa đặt trong .env}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt trong .env}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER chưa đặt trong .env}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD chưa đặt trong .env}
  SPRING_DATA_REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env}
  SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
  SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
  SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
  SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
  SERVICES_INTERVIEW_SERVICE_URL: http://interview-service:8085
  SERVICES_NOTIFICATION_SERVICE_URL: http://notification-service:8086
  SERVICES_DASHBOARD_SERVICE_URL: http://dashboard-service:8087
  SERVICES_AI_SERVICE_URL: http://ai-service:8088
  SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
  SERVICES_OFFER_SERVICE_URL: http://offer-service:8090

services:
  # ---------------- Hạ tầng ----------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy lần đầu, khi volume pgdata còn trống.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ats-network]
    logging: *logging

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    hostname: ats-rabbitmq   # cố định để dữ liệu trong volume không đổi node name
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    # Trang quản trị chỉ mở trên localhost của VPS: ssh -L 15672:localhost:15672 deploy@<IP>
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ats-network]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [ats-network]
    logging: *logging

  # ---------------- Java services ----------------
  auth-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/auth-service:${TAG:-latest}
    env_file: [./auth-service/.env]          # MAIL_*, AWS_*
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_auth
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL chưa đặt trong .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/api/auth/login/oauth2/code/google
      MAIL_LOG_OTP_ON_FAILURE: "false"

  masterdata-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/masterdata-service:${TAG:-latest}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_masterdata

  recruitment-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/recruitment-service:${TAG:-latest}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_recruitment

  candidate-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/candidate-service:${TAG:-latest}
    env_file: [./candidate-service/.env]     # AWS_*
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_candidate

  interview-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/interview-service:${TAG:-latest}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_interview

  notification-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/notification-service:${TAG:-latest}
    env_file: [./notification-service/.env]  # MAIL_*
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_notification
      APP_NOTIFICATION_EMAIL_ENABLED: "true"

  dashboard-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/dashboard-service:${TAG:-latest}
    environment:
      <<: *java-env

  application-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/application-service:${TAG:-latest}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_application

  offer-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/offer-service:${TAG:-latest}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_offer

  api-gateway:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/api-gateway:${TAG:-latest}
    environment:
      <<: *java-env
      APP_PUBLIC_ORIGIN: ${PUBLIC_URL}
    depends_on:
      - auth-service
      - masterdata-service
      - recruitment-service
      - candidate-service
      - interview-service
      - notification-service
      - dashboard-service
      - application-service
      - offer-service
      - ai-service

  # ---------------- AI service (Python) ----------------
  ai-service:
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/ai-service:${TAG:-latest}
    restart: unless-stopped
    env_file: [./ai-service/.env]            # OPENAI/GOOGLE key, AWS_*, model
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ats_ai
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      APPLICATION_SERVICE_URL: http://application-service:8089
      CANDIDATE_SERVICE_URL: http://candidate-service:8084
      MASTERDATA_SERVICE_URL: http://masterdata-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ats-network]
    logging: *logging

  # ---------------- Web ----------------
  frontend:
    image: ${REGISTRY:-ghcr.io/thanhduongw/ats}/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api-gateway]
    networks: [ats-network]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN chưa đặt trong .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [ats-network]
    logging: *logging

volumes:
  pgdata:
  rabbitmqdata:
  caddy_data:
  caddy_config:

networks:
  ats-network:
    driver: bridge
