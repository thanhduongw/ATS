services:
  # ==========================================
  # 1. MIDDLEWARE & DATABASES
  # ==========================================
  postgres:
    image: postgres:16
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ats-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ats_user
      RABBITMQ_DEFAULT_PASS: ats_password
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ats-network

  # ==========================================
  # 2. JAVA BACKEND MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ats-auth-service
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_auth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      # Google SSO: doc tu shell/.env cua nguoi chay compose, KHONG commit secret.
      # De trong => auth-service tu tat oauth2Login va van boot binh thuong.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/login/oauth2/code/google}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ats-network

  masterdata-service:
    build:
      context: ./masterdata-service
      dockerfile: Dockerfile
    container_name: ats-masterdata-service
    expose:
      - "8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_masterdata
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  recruitment-service:
    build:
      context: ./recruitment-service
      dockerfile: Dockerfile
    container_name: ats-recruitment-service
    expose:
      - "8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_recruitment
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  candidate-service:
    build:
      context: ./candidate-service
      dockerfile: Dockerfile
    container_name: ats-candidate-service
    # Khoa AWS doc tu ./candidate-service/.env, khong commit vao repo.
    env_file:
      - ./candidate-service/.env
    expose:
      - "8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_candidate
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network


  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: ats-interview-service
    expose:
      - "8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_interview
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: ats-notification-service
    expose:
      - "8086"
    env_file:
      - ./notification-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_notification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      APP_NOTIFICATION_EMAIL_ENABLED: "true"
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_INTERVIEW_SERVICE_URL: http://interview-service:8085
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ats-network

  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    container_name: ats-dashboard-service
    expose:
      - "8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_dashboard
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
      SERVICES_INTERVIEW_SERVICE_URL: http://interview-service:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: ats-application-service
    expose:
      - "8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_application
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  offer-service:
    build:
      context: ./offer-service
      dockerfile: Dockerfile
    container_name: ats-offer-service
    expose:
      - "8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_offer
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  # ==========================================
  # 3. API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ats-api-gateway
    ports:
      - "8080:8080"
    environment:
      # Route (path + id) khai bao mot noi duy nhat trong api-gateway/application.yml.
      # O day chi tro 9 downstream service sang DNS tren ats-network.
      # Route /ws/** dung lai SERVICES_NOTIFICATION_SERVICE_URL,
      # cac buoc OAuth2 (/api/auth/oauth2/**, /api/auth/login/oauth2/code/**)
      # dung lai route /api/auth/** => SERVICES_AUTH_SERVICE_URL.
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_INTERVIEW_SERVICE_URL: http://interview-service:8085
      SERVICES_NOTIFICATION_SERVICE_URL: http://notification-service:8086
      SERVICES_DASHBOARD_SERVICE_URL: http://dashboard-service:8087
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
      SERVICES_OFFER_SERVICE_URL: http://offer-service:8090
    depends_on:
      - auth-service
      - masterdata-service
      - recruitment-service
      - candidate-service
      - interview-service
      - notification-service
      - dashboard-service
      - application-service
      - offer-service
    networks:
      - ats-network

  # ==========================================
  # 4. FRONTEND SPA (REACT + NGINX)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ats-network

volumes:
  pgdata:

networks:
  ats-network:
    driver: bridge
