services:
  # ==========================================
  # 1. MIDDLEWARE & DATABASES
  # ==========================================
  postgres:
    image: postgres:16
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ats-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ats_user
      RABBITMQ_DEFAULT_PASS: ats_password
    networks:
      - ats-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ats-network

  # ==========================================
  # 2. JAVA BACKEND MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ats-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_auth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ats-network

  masterdata-service:
    build:
      context: ./masterdata-service
      dockerfile: Dockerfile
    container_name: ats-masterdata-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_masterdata
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  recruitment-service:
    build:
      context: ./recruitment-service
      dockerfile: Dockerfile
    container_name: ats-recruitment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_recruitment
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  candidate-service:
    build:
      context: ./candidate-service
      dockerfile: Dockerfile
    container_name: ats-candidate-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_candidate
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network


  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: ats-interview-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_interview
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: ats-notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_notification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ats-network

  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    container_name: ats-dashboard-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_dashboard
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: ats-application-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_application
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      SERVICES_CANDIDATE_SERVICE_URL: http://candidate-service:8084
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  offer-service:
    build:
      context: ./offer-service
      dockerfile: Dockerfile
    container_name: ats-offer-service
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_offer
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      SERVICES_MASTERDATA_SERVICE_URL: http://masterdata-service:8082
      SERVICES_APPLICATION_SERVICE_URL: http://application-service:8089
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  # ==========================================
  # 3. API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ats-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/auth/**

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: masterdata-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://masterdata-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/masterdata/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: recruitment-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://recruitment-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/recruitment/**

      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: candidate-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://candidate-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/candidate/**

      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: interview-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://interview-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/interview/**

      SPRING_CLOUD_GATEWAY_ROUTES_5_ID: notification-service
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://notification-service:8086
      SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/api/notification/**

      SPRING_CLOUD_GATEWAY_ROUTES_6_ID: dashboard-service
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://dashboard-service:8087
      SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: Path=/api/dashboard/**

      SPRING_CLOUD_GATEWAY_ROUTES_7_ID: application-service
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: http://application-service:8089
      SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0: Path=/api/application/**

      SPRING_CLOUD_GATEWAY_ROUTES_8_ID: offer-service
      SPRING_CLOUD_GATEWAY_ROUTES_8_URI: http://offer-service:8090
      SPRING_CLOUD_GATEWAY_ROUTES_8_PREDICATES_0: Path=/api/offer/**
    depends_on:
      - auth-service
      - masterdata-service
      - recruitment-service
      - candidate-service
      - interview-service
      - notification-service
      - dashboard-service
      - application-service
      - offer-service
    networks:
      - ats-network

  # ==========================================
  # 4. FRONTEND SPA (REACT + NGINX)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ats-network

volumes:
  pgdata:

networks:
  ats-network:
    driver: bridge