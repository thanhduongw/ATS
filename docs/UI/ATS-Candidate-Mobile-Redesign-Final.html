function clone(x){return JSON.parse(JSON.stringify(x))} function data(k){return state[k]??demo[k]} function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function money(n){return n?new Intl.NumberFormat('vi-VN').format(n/1e6)+'–'+new Intl.NumberFormat('vi-VN').format((n||0)/1e6)+' triệu':'Thỏa thuận'} function salary(j){return j.showSalary&&j.salaryMin?`${(j.salaryMin/1e6).toFixed(0)}–${(j.salaryMax/1e6).toFixed(0)} triệu`:'Thỏa thuận'} function date(v){if(!v)return '—';return new Date(v).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})} function dt(v){if(!v)return '—';return new Date(v).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} function time(v){if(!v)return '—';return new Date(v).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} function initials(n='Ứng viên'){return n.split(' ').slice(-2).map(x=>x[0]).join('').toUpperCase()} function statusLabel(s){return ({APPLIED:'Đã tiếp nhận',CV_SCREENING:'Sàng lọc hồ sơ',HR_SCREENING:'Sơ vấn HR',TECHNICAL_INTERVIEW:'Phỏng vấn chuyên môn',HR_INTERVIEW:'Phỏng vấn HR',FINAL_INTERVIEW:'Phỏng vấn cuối',OFFER:'Thư mời',HIRED:'Đã nhận việc',REJECTED:'Không phù hợp',WITHDRAWN:'Đã rút hồ sơ',SCHEDULED:'Đã lên lịch',HM_CONFIRMED:'Chờ bạn xác nhận',CANDIDATE_CONFIRMED:'Đã xác nhận',CANDIDATE_DECLINED:'Đã xin dời lịch',COMPLETED:'Đã hoàn tất',EVALUATION_PENDING:'Chờ đánh giá',CANCELLED:'Đã hủy',NO_SHOW:'Không tham dự',EXPIRED:'Hết hạn',APPROVED:'Đã gửi',ACCEPTED:'Đã chấp nhận',DECLINED:'Đã từ chối',PENDING_APPROVAL:'Chờ duyệt',REJECTED:'Đã từ chối',DRAFT:'Bản nháp'})[s]||s||'Đang xử lý'} function pill(s){let cls=['HIRED','ACCEPTED','CANDIDATE_CONFIRMED','COMPLETED'].includes(s)?'green':['REJECTED','WITHDRAWN','DECLINED','CANCELLED','NO_SHOW'].includes(s)?'red':['HM_CONFIRMED','PENDING_APPROVAL','OFFER','SCHEDULED'].includes(s)?'amber':'blue';return `<span class="pill ${cls}">${esc(statusLabel(s))}</span>`}
function toggleApi(){ $('#apiPanel').classList.toggle('open');$('#apiBase').value=state.apiBase;$('#apiToken').value=state.token; } function saveApi(){state.apiBase=$('#apiBase').value.replace(/\/$/,'');state.token=$('#apiToken').value;localStorage.setItem('atsBase',state.apiBase);localStorage.setItem('atsToken',state.token);$('#apiStatus').textContent=state.token?'Đã lưu token · thử tải dữ liệu backend':'Đã lưu URL · chưa đăng nhập';if(state.token){loadAll().then(()=>toast('Đã kết nối dữ liệu backend'));} } function clearApi(){state.token='';state.refresh='';localStorage.removeItem('atsToken');localStorage.removeItem('atsRefresh');$('#apiToken').value='';$('#apiStatus').textContent='Đã ngắt kết nối · đang dùng dữ liệu demo';toast('Đã chuyển về chế độ demo')}
async function req(path,opts={}){if(!state.token&&opts.auth!==false)throw Error('Bạn cần đăng nhập để thực hiện thao tác này.');let headers={...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;let res=await fetch(state.apiBase+path,{...opts,headers});if(res.status===401&&state.refresh){let rr=await fetch(state.apiBase+'/auth/refresh-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:state.refresh})});if(rr.ok){let t=await rr.json();state.token=t.accessToken;state.refresh=t.refreshToken;localStorage.setItem('atsToken',state.token);localStorage.setItem('atsRefresh',state.refresh);headers.Authorization='Bearer '+state.token;res=await fetch(state.apiBase+path,{...opts,headers});}}if(!res.ok){let msg='Yêu cầu không thành công ('+res.status+')';try{let j=await res.json();msg=j.message||Object.values(j).find(v=>typeof v==='string')||msg}catch{}throw Error(msg)}if(res.status===204)return null;let ct=res.headers.get('content-type')||'';return ct.includes('application/pdf')?res.blob():res.json()}
async function loadAll(){if(!state.token)return;try{let [p,j,a,i,o,n,s,e,sk]=await Promise.all([req('/candidate/me'),req('/recruitment/public/jobs',{auth:false}),req('/application/applications/my'),req('/interview/interviews/my'),req('/offer/offers/my'),req('/notification/notifications'),req('/masterdata/recruitment-sources'),req('/masterdata/education-levels'),req('/masterdata/skills')]);state.profile=p;state.jobs=j;state.apps=a;state.interviews=i;state.offers=o;state.notifications=n;state.sources=s.filter(x=>x.active!==false);state.education=e.filter(x=>x.active!==false);state.skills=sk.filter(x=>x.active!==false);state.demo=false;updateBadges();render();$('#apiStatus').textContent='Đã kết nối backend · dữ liệu thật';}catch(e){$('#apiStatus').textContent='Không tải được dữ liệu: '+e.message;throw e}}

jobDetail(){let j=state.selectedJob;if(!j)return this.jobs();let applied=(data('apps')||[]).find(a=>a.jobPostingId===j.id);return `<section class="screen">${header('Chi tiết việc làm')}<div class="detailhero"><div class="row"><div class="joblogo">${esc((j.departmentName||'C').slice(0,1))}</div><div class="grow"><div class="sub">${esc(j.departmentName||'Công ty')}</div><div class="jobtitle">${esc(j.title)}</div></div>${j.urgent?'<span class="pill amber">Tuyển gấp</span>':''}</div><div class="detailtitle">${esc(j.title)}</div><div class="jobmeta">${esc(j.departmentName||'')} · ${esc(j.workLocationName||'')}</div><div class="divider"></div><div class="infogrid"><div class="infobox"><span>Mức lương</span><b class="salary">${salary(j)}</b></div><div class="infobox"><span>Hình thức</span><b>${esc(j.employmentTypeName||'—')}</b></div><div class="infobox"><span>Nơi làm việc</span><b>${esc(j.workLocationName||'—')}</b></div><div class="infobox"><span>Kinh nghiệm</span><b>${esc(j.experienceRequired||'Không yêu cầu')}</b></div></div><div class="jobtags"><span>${j.workArrangement==='REMOTE'?'Từ xa':j.workArrangement==='HYBRID'?'Hybrid':'Tại văn phòng'}</span><span>Hạn nộp ${date(j.applicationDeadline)}</span><span>Đăng ${date(j.publishedAt||j.createdAt)}</span></div></div><div class="card"><h3 class="h2" style="font-size:14px;margin-bottom:10px">Mô tả công việc</h3><div class="sub">${esc(j.description||'Thông tin đang được cập nhật.').replace(/\n/g,'<br>')}</div><div class="divider"></div><h3 class="h2" style="font-size:14px;margin-bottom:10px">Yêu cầu ứng viên</h3><div class="sub">${esc(j.requirements||'Thông tin đang được cập nhật.').replace(/\n/g,'<br>')}</div><div class="divider"></div><h3 class="h2" style="font-size:14px;margin-bottom:10px">Quyền lợi</h3><div class="sub">${esc(j.benefits||'Thông tin đang được cập nhật.').replace(/\n/g,'<br>')}</div></div><div class="card"><div class="between"><b style="font-size:11px">Thông tin ứng tuyển</b><span class="pill green">Ứng tuyển trực tuyến</span></div><p class="sub">Hệ thống sẽ sử dụng CV đang lưu trong hồ sơ ứng viên. Bạn có thể cập nhật CV trước khi gửi đơn.</p></div><div class="stickyaction">${applied?`<button class="btn secondary full" onclick="openScreen('applicationDetail',${applied.id})">Đã ứng tuyển · Xem hồ sơ</button>`:`<button class="btn ghost" onclick="toggleSave(${j.id})">♡ Lưu</button><button class="btn" onclick="startApply(${j.id})">Ứng tuyển ngay →</button>`}</div></section>`},
apply(){let j=state.selectedJob,p=data('profile');return `<section class="screen">${header('Xác nhận ứng tuyển')}<div class="card"><div class="eyebrow">VỊ TRÍ ỨNG TUYỂN</div><div class="jobtitle" style="margin-top:7px">${esc(j?.title||'')}</div><div class="jobmeta">${esc(j?.departmentName||'')} · ${esc(j?.workLocationName||'')}</div><div class="divider"></div><div class="row"><div class="listicon">▤</div><div class="grow"><b style="font-size:11px">${p?.resumeUploaded?'CV_Nguyen_Minh_Anh.pdf':'Chưa có CV'}</b><span class="sub" style="display:block">${p?.resumeUploaded?'CV hiện tại trong hồ sơ của bạn':'Tải CV tại mục Tài khoản trước khi ứng tuyển.'}</span></div><button class="link" onclick="openScreen('profile')">${p?.resumeUploaded?'Đổi CV':'Tải CV'}</button></div></div><div class="field"><label>Bạn biết đến vị trí này từ đâu? <span style="color:var(--red)">*</span></label><select id="applySource" class="select"><option value="">Chọn nguồn tuyển dụng</option>${(data('sources')||[]).filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><small>Thông tin này giúp doanh nghiệp hiểu kênh tuyển dụng hiệu quả.</small></div><div class="field"><label>Lời nhắn cho nhà tuyển dụng (không bắt buộc)</label><textarea id="applyNote" class="textarea" placeholder="Giới thiệu ngắn về bản thân hoặc điều bạn muốn chia sẻ..."></textarea></div><label class="checkline"><input type="checkbox" id="applyConsent"> Tôi đồng ý để doanh nghiệp xử lý dữ liệu cá nhân và hồ sơ ứng tuyển của tôi cho mục đích tuyển dụng. <span style="color:var(--red)">*</span></label><div class="card" style="background:var(--mint2)"><b style="font-size:10px;color:var(--green)">Trước khi gửi hồ sơ</b><p class="sub">Vui lòng kiểm tra thông tin cá nhân và CV trong mục Tài khoản. Sau khi gửi, bạn có thể theo dõi tiến trình tại Đơn của tôi.</p></div><div class="stickyaction"><button class="btn ghost" onclick="back()">Quay lại</button><button class="btn" onclick="submitApply()">Gửi hồ sơ ứng tuyển</button></div></section>`},
applications(){let apps=data('apps')||[];return `<section class="screen"><div class="eyebrow">HÀNH TRÌNH CỦA BẠN</div><h1 class="h1">Đơn ứng tuyển</h1><p class="sub">Theo dõi trạng thái các vị trí bạn đã gửi hồ sơ.</p><div class="statgrid" style="margin-top:16px"><div class="stat"><b>${apps.length}</b><span>Tổng hồ sơ</span></div><div class="stat"><b>${apps.filter(a=>!['REJECTED','WITHDRAWN','HIRED'].includes(a.currentStageType)).length}</b><span>Đang xử lý</span></div><div class="stat"><b>${apps.filter(a=>a.currentStageType==='HIRED').length}</b><span>Đã nhận việc</span></div></div><div class="chips"><button class="chip active" onclick="filterApps('all',this)">Tất cả</button><button class="chip" onclick="filterApps('active',this)">Đang xử lý</button><button class="chip" onclick="filterApps('closed',this)">Đã kết thúc</button></div><div id="appsList">${apps.length?apps.map(appCard).join(''):`<div class="empty"><div class="emptyicon">▤</div><b>Bạn chưa có đơn ứng tuyển</b><p>Khám phá việc làm phù hợp và gửi hồ sơ đầu tiên nhé.</p><button class="btn" onclick="openScreen('jobs')">Tìm việc ngay</button></div>`}</div><div class="sectionhead"><h2 class="h2">Thư mời nhận việc</h2><button class="link" onclick="openScreen('offers')">Xem tất cả</button></div>${(data('offers')||[]).filter(o=>['APPROVED','ACCEPTED'].includes(o.status)).length?`<div class="card" onclick="openScreen('offers')"><div class="row"><div class="listicon">✉</div><div class="grow"><b>Thư mời đang chờ phản hồi</b><span>Kiểm tra thông tin và thời hạn phản hồi</span></div>→</div></div>`:`<div class="card"><div class="sub">Khi có thư mời, thông tin sẽ xuất hiện tại đây.</div></div>`}</section>`},
interviews(){let list=data('interviews')||[];let finished=['EVALUATION_PENDING','COMPLETED','NO_SHOW','CANCELLED','EXPIRED'];let up=list.filter(x=>{let end=new Date(x.scheduledAt||0).getTime()+(x.durationMinutes||0)*60000;return end>=Date.now()&&!finished.includes(x.status)});let past=list.filter(x=>!up.includes(x));return `<section class="screen"><div class="eyebrow">LỊCH TRÌNH TUYỂN DỤNG</div><h1 class="h1">Lịch phỏng vấn</h1><p class="sub">Xem lịch hẹn và phản hồi với nhà tuyển dụng.</p><div class="chips" style="margin-top:16px"><button class="chip active" onclick="filterInterviews('up',this)">Sắp tới (${up.length})</button><button class="chip" onclick="filterInterviews('past',this)">Đã qua (${past.length})</button></div><div id="interviewList">${up.length?up.map(interviewCard).join(''):`<div class="empty"><div class="emptyicon">▦</div><b>Chưa có lịch phỏng vấn sắp tới</b><p>Khi doanh nghiệp xác nhận lịch, bạn sẽ nhận được thông báo tại đây.</p></div>`}</div></section>`},
notifications(){let list=data('notifications')||[];return `<section class="screen"><div class="between"><div><div class="eyebrow">CẬP NHẬT MỚI NHẤT</div><h1 class="h1">Thông báo</h1></div><button class="link" onclick="markAllRead()">Đọc tất cả</button></div><div class="chips"><button class="chip active" onclick="filterNoti('all',this)">Tất cả</button><button class="chip" onclick="filterNoti('unread',this)">Chưa đọc (${list.filter(n=>!n.read).length})</button></div><div id="notiList">${list.length?list.map(notiCard).join(''):`<div class="empty"><div class="emptyicon">♧</div><b>Chưa có thông báo</b><p>Cập nhật về hồ sơ, lịch phỏng vấn và thư mời sẽ được gửi đến đây.</p></div>`}</div></section>`},
profile(){let p=data('profile')||demo.profile;let pct=[p.fullName,p.phone,p.dateOfBirth,p.gender,p.address,p.currentPosition,p.educationLevelId,p.skillNames?.length,p.resumeUploaded].filter(Boolean).length/9*100;return `<section class="screen"><div class="eyebrow">KHÔNG GIAN CÁ NHÂN</div><h1 class="h1">Tài khoản</h1>${state.demo?`<div class="card" style="background:var(--mint2);border-color:#dcece3"><div class="between"><div class="grow"><b style="font-size:11px;color:var(--green)">Đang xem bản trải nghiệm</b><div class="sub">Đăng nhập để tải dữ liệu và thao tác trực tiếp với ATS Backend.</div></div><button class="btn sm" onclick="openScreen('login')">Đăng nhập</button></div></div>`:''}<div class="profilehead"><div class="row"><div class="avatar">${initials(p.fullName)}</div><div class="grow"><div class="jobtitle">${esc(p.fullName)}</div><div class="jobmeta">${esc(p.email||'')}</div><span class="pill green" style="margin-top:5px">Ứng viên</span></div><button class="iconbtn" onclick="openScreen('editProfile')">✎</button></div><div class="profilecompletion"><b>Hoàn thiện hồ sơ</b><strong style="color:var(--green)">${Math.round(pct)}%</strong></div><div class="progress"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:7px">${pct<100?'Bổ sung thông tin để nhà tuyển dụng hiểu rõ hơn về bạn.':'Hồ sơ của bạn đã đầy đủ.'}</div></div><div class="card"><div class="between"><b style="font-size:12px">CV ứng tuyển</b><span class="pill ${p.resumeUploaded?'green':'amber'}">${p.resumeUploaded?'Đã tải lên':'Chưa có CV'}</span></div><div class="row" style="margin-top:13px"><div class="listicon">▤</div><div class="grow"><b>${p.resumeUploaded?esc((p.resumeUrl||'CV ứng viên').split('/').pop()):'Tải CV của bạn'}</b><span>${p.resumeUploaded?'Cập nhật '+date(p.resumeUploadedAt):'PDF, DOC hoặc DOCX · tối đa 10 MB'}</span></div><button class="btn secondary sm" onclick="document.getElementById('resumeFile').click()">${p.resumeUploaded?'Thay CV':'Tải CV'}</button><input id="resumeFile" type="file" accept=".pdf,.doc,.docx" class="hide" onchange="uploadResume(this)"></div></div><div class="card"><div class="between"><b style="font-size:12px">Thông tin cá nhân</b><button class="link" onclick="openScreen('editProfile')">Chỉnh sửa</button></div>${[['Họ và tên',p.fullName],['Số điện thoại',p.phone],['Ngày sinh',date(p.dateOfBirth)],['Giới tính',({MALE:'Nam',FEMALE:'Nữ',OTHER:'Khác'})[p.gender]||p.gender],['Địa chỉ',p.address],['Vị trí hiện tại',p.currentPosition],['Học vấn',p.educationLevelName],['Kỹ năng',(p.skillNames||[]).join(', ')]].map(([a,b])=>`<div class="switchrow"><span class="sub">${a}</span><b style="font-size:10px;text-align:right;max-width:60%">${esc(b||'Chưa cập nhật')}</b></div>`).join('')}</div><div class="card"><div class="listrow" onclick="openScreen('offers')"><div class="listicon">✉</div><div class="grow"><b>Thư mời nhận việc</b><span>${(data('offers')||[]).length} thư mời</span></div>›</div><div class="listrow" onclick="openScreen('notifications')"><div class="listicon">♧</div><div class="grow"><b>Thông báo</b><span>Cập nhật hồ sơ và lịch hẹn</span></div>›</div><div class="listrow" onclick="openModal('privacy')"><div class="listicon">◇</div><div class="grow"><b>Dữ liệu & quyền riêng tư</b><span>Yêu cầu xóa hồ sơ cá nhân</span></div>›</div><div class="listrow" onclick="signOut()"><div class="listicon" style="color:var(--red);background:var(--redbg)">↗</div><div class="grow"><b style="color:var(--red)">Đăng xuất</b><span>Kết thúc phiên làm việc</span></div>›</div></div><div class="tiny muted" style="text-align:center;padding:5px 0 15px">ATS Career · Candidate Portal · v1.0</div></section>`},
applicationDetail(){let a=state.selectedApp;if(!a)return this.applications();let phase=a.currentStageType;let closed=['REJECTED','WITHDRAWN','HIRED'].includes(phase);return `<section class="screen">${header('Chi tiết hồ sơ')}<div class="card"><div class="eyebrow">MÃ HỒ SƠ #${a.id}</div><div class="jobtitle" style="font-size:16px;margin:7px 0">${esc(a.jobTitle)}</div><div class="jobmeta">${esc(a.departmentName||'')} · Ứng tuyển ${dt(a.appliedAt)}</div><div style="margin-top:12px">${pill(phase)}</div><div class="divider"></div><div class="between"><span class="sub">Vòng hiện tại</span><b style="font-size:11px">${esc(a.currentStageName||statusLabel(phase))}</b></div><div class="between" style="margin-top:10px"><span class="sub">Chuyên viên phụ trách</span><b style="font-size:10px">${esc(a.recruiterName||'Đang cập nhật')}</b></div>${a.rejectionReasonName?`<div class="divider"></div><div class="sub">Lý do: ${esc(a.rejectionReasonName)}</div>`:''}</div><div class="sectionhead"><h2 class="h2">Tiến trình ứng tuyển</h2></div><div class="card"><div class="timeline">${timelineFor(a)}</div><p class="sub" style="margin:12px 0 0">Hệ thống hiển thị vòng tuyển dụng hiện tại theo dữ liệu ATS. Thời điểm chi tiết từng vòng sẽ được cập nhật khi backend cung cấp.</p></div>${a.resumeUrl?`<div class="card"><div class="row"><div class="listicon">▤</div><div class="grow"><b style="font-size:11px">CV đã nộp</b><span>${esc(a.resumeUrl.split('/').pop())}</span></div></div></div>`:''}<div class="stickyaction">${!closed?`<button class="btn danger full" onclick="openModal('withdraw')">Rút đơn ứng tuyển</button>`:`<button class="btn secondary full" onclick="openScreen('jobs')">Khám phá việc làm khác</button>`}</div></section>`},
offers(){let offers=data('offers')||[];return `<section class="screen"><div class="eyebrow">CƠ HỘI MỚI</div><h1 class="h1">Thư mời nhận việc</h1><p class="sub">Xem thông tin đề nghị và phản hồi trong thời hạn.</p>${offers.length?offers.map(o=>`<div class="card" onclick="openScreen('offerDetail',${o.id})"><div class="between"><span class="pill ${o.status==='APPROVED'?'green':'amber'}">${esc(statusLabel(o.status))}</span><span class="tiny muted">${date(o.createdAt)}</span></div><div class="jobtitle" style="margin:11px 0 4px">${esc(o.jobTitle||'Vị trí tuyển dụng')}</div><div class="jobmeta">${esc(o.contractTypeName||'Hợp đồng')} · ${o.startDate?'Bắt đầu '+date(o.startDate):'Ngày bắt đầu đang cập nhật'}</div><div class="salary" style="margin-top:10px">${o.salaryOffered?new Intl.NumberFormat('vi-VN').format(o.salaryOffered)+' '+(o.currency||'VND'):'Mức lương theo thỏa thuận'}</div><div class="between" style="margin-top:12px"><span class="sub">${o.responseDeadline?'Phản hồi trước '+dt(o.responseDeadline):'Xem chi tiết điều khoản'}</span><b style="color:var(--green)">Chi tiết →</b></div></div>`).join(''):`<div class="empty"><div class="emptyicon">✉</div><b>Chưa có thư mời nhận việc</b><p>Khi doanh nghiệp gửi thư mời đã được duyệt, bạn có thể xem và phản hồi tại đây.</p><button class="btn secondary sm" onclick="openScreen('applications')">Xem đơn ứng tuyển</button></div>`}</section>`},
offerDetail(){let o=state.selectedOffer;if(!o)return this.offers();let pending=o.status==='APPROVED';return `<section class="screen">${header('Chi tiết thư mời')}<div class="offerbanner"><div class="eyebrow">THƯ MỜI NHẬN VIỆC</div><h2>${esc(o.jobTitle||'Vị trí tuyển dụng')}</h2><p>${esc(o.contractTypeName||'Hợp đồng')} · ${o.startDate?'Ngày bắt đầu '+date(o.startDate):'Ngày bắt đầu sẽ được xác nhận'}</p><div style="margin-top:13px">${pill(o.status)}</div></div><div class="card"><div class="eyebrow">ĐỀ NGHỊ THU NHẬP</div><div style="font-size:24px;font-weight:800;color:var(--green);margin:7px 0">${o.salaryOffered?new Intl.NumberFormat('vi-VN').format(o.salaryOffered)+' '+(o.currency||'VND'):'Theo thỏa thuận'}</div><div class="sub">${esc(o.payFrequency||'Chu kỳ trả lương chưa cập nhật')}</div><div class="divider"></div>${[['Loại hợp đồng',o.contractTypeName],['Thử việc',o.probationMonths!=null?o.probationMonths+' tháng':null],['Ngày bắt đầu',date(o.startDate)],['Giờ có mặt',o.startTime],['Quản lý trực tiếp',o.reportingManager],['Phụ cấp',o.allowance?new Intl.NumberFormat('vi-VN').format(o.allowance)+' '+(o.currency||'VND'):null],['Nghỉ phép năm',o.annualLeaveDays?o.annualLeaveDays+' ngày':null],['Thưởng hiệu suất',o.performanceBonus]].filter(x=>x[1]).map(([k,v])=>`<div class="switchrow"><span class="sub">${k}</span><b style="font-size:10px;text-align:right">${esc(v)}</b></div>`).join('')}</div>${o.benefits||o.candidateVisibleNote?`<div class="card"><h3 class="h2" style="font-size:13px;margin-bottom:10px">Quyền lợi & ghi chú</h3><p class="sub">${esc(o.benefits||'')}</p><p class="sub">${esc(o.candidateVisibleNote||'')}</p></div>`:''}<div class="card"><div class="between"><b style="font-size:11px">Thời hạn phản hồi</b><span class="pill amber">${o.responseDeadline?dt(o.responseDeadline):'Theo thông báo HR'}</span></div><p class="sub" style="margin-top:8px">Vui lòng đọc kỹ các điều khoản trước khi xác nhận. Việc chấp nhận hoặc từ chối sẽ được ghi nhận vào hệ thống.</p><button class="btn ghost full sm" onclick="downloadOffer(${o.id})">↓ Tải thư mời PDF</button></div>${pending?`<div class="stickyaction"><button class="btn danger" onclick="openModal('declineOffer')">Từ chối</button><button class="btn" onclick="acceptOffer(${o.id})">Chấp nhận thư mời</button></div>`:''}</section>`},
interviewDetail(){let iv=state.selectedInterview;if(!iv)return this.interviews();let a=(data('apps')||[]).find(x=>x.id===iv.applicationId);let waiting=iv.status==='HM_CONFIRMED'&&new Date(iv.scheduledAt)>new Date();return `<section class="screen">${header('Chi tiết lịch phỏng vấn')}<div class="card"><div class="eyebrow">${date(iv.scheduledAt)}</div><div class="detailtitle">${esc(a?.jobTitle||'Buổi phỏng vấn')}</div><div class="row" style="margin:12px 0"><div class="listicon">▦</div><div class="grow"><b style="font-size:12px">${time(iv.scheduledAt)} · ${iv.durationMinutes||60} phút</b><span>${iv.format==='ONLINE'?'Phỏng vấn trực tuyến':'Phỏng vấn trực tiếp'}</span></div>${pill(iv.status)}</div><div class="divider"></div><div class="switchrow"><span class="sub">Hình thức</span><b style="font-size:10px">${iv.format==='ONLINE'?'Trực tuyến':'Trực tiếp'}</b></div><div class="switchrow"><span class="sub">Người phỏng vấn</span><b style="font-size:10px;text-align:right">${esc((iv.interviewerNames||[]).join(', ')||'Đang cập nhật')}</b></div>${iv.format==='ONLINE'&&iv.meetingLink?`<div class="switchrow"><span class="sub">Liên kết tham gia</span><a href="${esc(iv.meetingLink)}" target="_blank" style="font-size:10px;color:var(--green)">Mở cuộc họp ↗</a></div>`:''}${iv.candidateDeclineReason?`<div class="divider"></div><p class="sub">Lý do xin dời: ${esc(iv.candidateDeclineReason)}</p>`:''}</div>${waiting?`<div class="card" style="background:var(--mint2)"><b style="font-size:11px;color:var(--green)">Vui lòng xác nhận tham gia</b><p class="sub">Thời gian đã được nhà tuyển dụng chốt. Bạn có thể đồng ý hoặc gửi yêu cầu dời lịch kèm lý do.</p><div class="row"><button class="btn secondary full" onclick="confirmInterview(${iv.id})">Tôi sẽ tham gia</button><button class="btn ghost full" onclick="openModal('declineInterview')">Xin dời lịch</button></div></div>`:iv.status==='CANDIDATE_CONFIRMED'&&iv.format==='ONLINE'?`<button class="btn full" onclick="window.open('${esc(iv.meetingLink||'#')}','_blank')">Tham gia phỏng vấn ↗</button>`:''}<button class="btn ghost full" style="margin-top:9px" onclick="openScreen('applicationDetail',${iv.applicationId})">Xem đơn ứng tuyển liên quan</button></section>`},

// Redesigned Candidate information architecture: Home / Jobs / My applications / Profile.

  <div class="sectionhead"><div><div class="section-kicker">TÌM THEO BỘ PHẬN</div><h2 class="h2">Lĩnh vực quan tâm</h2></div><button class="link" onclick="openJobs()">Tất cả</button></div>
  <div class="category-grid">${depts.slice(0,10).map(d=>`<button class="category-tile" onclick="chooseDepartment(${JSON.stringify(d)})"><b>${esc(d)}</b></button>`).join('')}</div>
  <div class="sectionhead"><div><div class="section-kicker">VỊ TRÍ MỚI</div><h2 class="h2">Cơ hội đang tuyển</h2></div><button class="link" onclick="openJobs()">Xem tất cả (${jobs.length}) →</button></div>
  <div class="job-list-premium">${featured.length?featured.map(jobCard).join(''):`<div class="empty"><b>Hiện chưa có vị trí tuyển dụng</b><p>Các cơ hội mới sẽ được cập nhật tại đây.</p></div>`}</div>
  <div class="saved-promo" onclick="showSaved()"><div class="grow"><b>Việc làm đã lưu</b><span>${state.saved.length} vị trí trong danh sách của bạn</span></div><strong>→</strong></div>
 </section>`;
};
views.jobs=function(){
 let all=(data('jobs')||[]).filter(j=>{let q=(state.query||'').toLowerCase();return(!q||[j.title,j.departmentName,j.workLocationName,j.experienceRequired].join(' ').toLowerCase().includes(q))&&(!state.filter.type||j.employmentTypeName===state.filter.type)&&(!state.filter.location||j.workLocationName?.includes(state.filter.location))&&(!state.filter.arrangement||j.workArrangement===state.filter.arrangement)&&(!state.showSavedOnly||state.saved.includes(j.id))});
 const shown=all.slice(0,state.jobLimit||8); const label=state.showSavedOnly?'Việc làm đã lưu':state.query||state.filterApplied?'Kết quả tìm kiếm':'Tất cả vị trí';
 return `<section class="screen"><div class="eyebrow">CƠ HỘI NGHỀ NGHIỆP</div><div class="between"><h1 class="h1">Việc làm</h1><button class="link" onclick="state.showSavedOnly=!state.showSavedOnly;state.jobLimit=8;render()">${state.showSavedOnly?'Tất cả việc làm':'Đã lưu ♡'}</button></div><p class="sub">Tìm kiếm và lọc các vị trí đang mở.</p>
 <div class="search-section"><div class="searchbox searchbox-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="jobsearch" placeholder="Tên vị trí, phòng ban hoặc địa điểm" value="${esc(state.query)}" oninput="state.query=this.value;state.showSavedOnly=false;state.jobLimit=8;refreshJobList()"><button class="filter-action" onclick="openModal('filters')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10m-7 6h4"/></svg></button></div></div>
 <div class="category-grid" style="margin:0 0 12px">${[...new Set((data('jobs')||[]).map(j=>j.departmentName).filter(Boolean))].map(d=>`<button class="category-tile" onclick="chooseDepartment(${JSON.stringify(d)})"><b>${esc(d)}</b></button>`).join('')}</div>
 <div class="between" style="margin:10px 0 12px"><b style="font-size:12px">${esc(label)}</b><span class="section-note">${all.length} vị trí</span></div>
 <div id="joblist" class="job-list-premium">${shown.length?shown.map(jobCard).join(''):`<div class="empty"><b>${state.showSavedOnly?'Chưa lưu việc làm nào':'Không tìm thấy vị trí phù hợp'}</b><p>Thử thay đổi từ khóa hoặc bộ lọc.</p><button class="btn secondary sm" onclick="resetFilters()">Xóa bộ lọc</button></div>`}</div>
 ${shown.length<all.length?`<button class="btn ghost full" id="moreJobs" onclick="loadMoreJobs()">Hiển thị thêm ${Math.min(8,all.length-shown.length)} vị trí</button>`:''}
 </section>`;
};
views.applicationDetail=function(){
 let a=state.selectedApp;if(!a)return this.applications();
 let ivs=(data('interviews')||[]).filter(x=>String(x.applicationId)===String(a.id)).sort((x,y)=>new Date(x.scheduledAt)-new Date(y.scheduledAt));
 let offers=(data('offers')||[]).filter(x=>String(x.applicationId)===String(a.id)).sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));
 let closed=['REJECTED','WITHDRAWN','HIRED'].includes(a.currentStageType);
 return `<section class="screen">${header('Chi tiết đơn ứng tuyển')}<div class="card"><div class="between"><span class="eyebrow">ĐƠN #${a.id}</span>${pill(a.currentStageType)}</div><div class="jobtitle" style="font-size:18px;margin:8px 0 4px">${esc(a.jobTitle)}</div><div class="jobmeta">${esc(a.departmentName||'')} · Nộp ngày ${date(a.appliedAt)}</div><div class="divider"></div><div class="between"><span class="sub">Trạng thái hiện tại</span><b style="font-size:11px">${esc(a.currentStageName||statusLabel(a.currentStageType))}</b></div>${a.recruiterName?`<div class="between" style="margin-top:8px"><span class="sub">Chuyên viên phụ trách</span><b style="font-size:11px">${esc(a.recruiterName)}</b></div>`:''}<div class="divider"></div><div class="eyebrow">TIẾN TRÌNH TUYỂN DỤNG</div><div class="timeline" style="margin-top:12px">${timelineFor(a)}</div>${a.resumeUrl?`<div class="divider"></div><div class="between"><span class="sub">CV đã nộp</span><b style="font-size:10px">Đã đính kèm</b></div>`:''}</div>
 <div class="sectionhead"><div><div class="section-kicker">LỊCH HẸN</div><h2 class="h2">Phỏng vấn</h2></div><span class="section-note">${ivs.length} lịch</span></div>
 ${ivs.length?ivs.map(iv=>`<div class="card" onclick="openScreen('interviewDetail',${iv.id})"><div class="between"><b style="font-size:12px">${date(iv.scheduledAt)} · ${time(iv.scheduledAt)}</b>${pill(iv.status)}</div><div class="jobmeta" style="margin-top:6px">${iv.durationMinutes||60} phút · ${iv.format==='ONLINE'?'Trực tuyến':'Trực tiếp'}</div>${iv.interviewerNames?.length?`<div class="jobmeta">Người phỏng vấn: ${esc(iv.interviewerNames.join(', '))}</div>`:''}<div class="between" style="margin-top:9px"><span class="sub">${iv.candidateConfirmed?'Bạn đã xác nhận':iv.status==='HM_CONFIRMED'?'Cần xác nhận tham gia':'Xem thông tin buổi phỏng vấn'}</span><span class="link">Chi tiết →</span></div></div>`).join(''):`<div class="card"><div class="sub">Chưa có lịch phỏng vấn cho đơn này. Khi nhà tuyển dụng sắp xếp lịch, thông tin sẽ xuất hiện tại đây.</div></div>`}
 <div class="sectionhead"><div><div class="section-kicker">KẾT QUẢ TUYỂN DỤNG</div><h2 class="h2">Thư mời nhận việc</h2></div></div>

 ${!closed?`<button class="btn ghost full" style="margin-top:8px" onclick="state.selectedApp=data('apps').find(x=>String(x.id)===String(${a.id}));openModal('withdraw')">Rút đơn ứng tuyển</button>`:''}
 </section>`;
};

// Replace the decorative job tile with a plain, information-led job listing.
function jobCard(j){let saved=state.saved.includes(j.id);let applied=(data('apps')||[]).some(a=>String(a.jobPostingId)===String(j.id));return `<article class="job-card-premium" onclick="openScreen('jobDetail',${j.id})"><div class="job-card-top"><div class="grow"><div class="company-name">${esc(j.departmentName||'Vị trí tuyển dụng')}</div><div class="job-posted">${j.urgent?'ƯU TIÊN TUYỂN DỤNG':'ĐANG NHẬN HỒ SƠ'}</div></div><button class="heart ${saved?'saved':''}" aria-label="Lưu việc làm" onclick="event.stopPropagation();toggleSave(${j.id})"><svg viewBox="0 0 24 24" fill="${saved?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.8c0 5.4-8.8 11-8.8 11s-8.8-5.6-8.8-11a4.7 4.7 0 0 1 8.8-2.1 4.7 4.7 0 0 1 8.8 2.1Z"/></svg></button></div><div class="job-card-title">${esc(j.title)}</div><div class="job-card-meta"><span>⌖ ${esc(j.workLocationName||'Địa điểm đang cập nhật')}</span><span>◷ ${esc(j.experienceRequired||'Không yêu cầu kinh nghiệm')}</span></div><div class="job-card-bottom"><div>${j.showSalary&&j.salaryMin!=null?`<span class="salary-label">MỨC LƯƠNG</span><div class="salary salary-large">${salary(j)}</div>`:`<span class="salary-label">MỨC LƯƠNG</span><div class="salary salary-large">Thỏa thuận</div>`}</div>${applied?'<span class="pill green">Đã ứng tuyển</span>':j.urgent?'<span class="pill amber">Tuyển gấp</span>':'<span class="link">Xem chi tiết →</span>'}</div><div class="jobtags"><span>${esc(j.employmentTypeName||'Toàn thời gian')}</span><span>${esc(j.workArrangement==='REMOTE'?'Từ xa':j.workArrangement==='HYBRID'?'Hybrid':'Tại văn phòng')}</span>${j.applicationDeadline?`<span>Hạn ${date(j.applicationDeadline)}</span>`:''}</div></article>`}
function openJobs(){state.showSavedOnly=false;state.jobLimit=8;openScreen('jobs')}
function chooseDepartment(name){state.query=name;state.filterApplied=false;state.showSavedOnly=false;state.jobLimit=8;openScreen('jobs')}
function refreshJobList(){let all=(data('jobs')||[]).filter(j=>{let q=(state.query||'').toLowerCase();return(!q||[j.title,j.departmentName,j.workLocationName,j.experienceRequired].join(' ').toLowerCase().includes(q))&&(!state.filter.type||j.employmentTypeName===state.filter.type)&&(!state.filter.location||j.workLocationName?.includes(state.filter.location))&&(!state.filter.arrangement||j.workArrangement===state.filter.arrangement)&&(!state.showSavedOnly||state.saved.includes(j.id))});let shown=all.slice(0,state.jobLimit||8);let root=$('#joblist');if(root)root.innerHTML=shown.length?shown.map(jobCard).join(''):`<div class="empty"><b>Không có kết quả phù hợp</b><p>Thử thay đổi từ khóa hoặc bộ lọc.</p></div>`;let more=$('#moreJobs');if(more)more.classList.toggle('hide',shown.length>=all.length)}
function loadMoreJobs(){state.jobLimit=(state.jobLimit||8)+8;let all=(data('jobs')||[]).filter(j=>{let q=(state.query||'').toLowerCase();return(!q||[j.title,j.departmentName,j.workLocationName,j.experienceRequired].join(' ').toLowerCase().includes(q))&&(!state.filter.type||j.employmentTypeName===state.filter.type)&&(!state.filter.location||j.workLocationName?.includes(state.filter.location))&&(!state.filter.arrangement||j.workArrangement===state.filter.arrangement)&&(!state.showSavedOnly||state.saved.includes(j.id))});let root=$('#joblist');if(root)root.innerHTML=all.slice(0,state.jobLimit).map(jobCard).join('');let more=$('#moreJobs');if(more)more.classList.toggle('hide',state.jobLimit>=all.length);if(more&&state.jobLimit<all.length)more.textContent=`Hiển thị thêm ${Math.min(8,all.length-state.jobLimit)} vị trí`}
function updateBadges(){let n=(data('notifications')||[]).filter(x=>!x.read).length;let b=$('#notibadge');if(b){b.textContent=n;b.classList.toggle('hide',!n)}let dot=$('#topdot');if(dot)dot.classList.toggle('hide',!n)}
function nav(){let visible=['home','jobs','applications','notifications','profile'].includes(state.screen);$('#bottomnav').classList.toggle('hide',!visible);$$('.navitem').forEach(x=>x.classList.toggle('active',state.screen!=='notifications'&&x.dataset.tab===state.tab));$('#appbar').classList.toggle('hide',['login','register','verify','forgot','reset','welcome'].includes(state.screen));}
function openScreen(s,id){if(state.screen!==s)state.stack.push({screen:state.screen,tab:state.tab});state.screen=s;if(s==='jobDetail')state.selectedJob=(data('jobs')||[]).find(x=>String(x.id)===String(id))||state.selectedJob;if(s==='applicationDetail')state.selectedApp=(data('apps')||[]).find(x=>String(x.id)===String(id))||state.selectedApp;if(s==='offerDetail')state.selectedOffer=(data('offers')||[]).find(x=>String(x.id)===String(id))||state.selectedOffer;if(s==='interviewDetail')state.selectedInterview=(data('interviews')||[]).find(x=>String(x.id)===String(id))||state.selectedInterview;if(['home','jobs','applications','profile','notifications'].includes(s)){state.tab=['notifications'].includes(s)?state.tab:s;state.stack=[]}if(s==='jobs')state.showSavedOnly=!!state.showSavedOnly;render()}
function back(){if(state.stack.length){let x=state.stack.pop();state.screen=x.screen;state.tab=x.tab;render()}else openScreen('home')}
function render(){nav();let c=$('#content');c.innerHTML=views[state.screen]?views[state.screen]():views.home();c.scrollTop=0;updateBadges()}
function openNotification(id){let n=(data('notifications')||[]).find(x=>String(x.id)===String(id));if(!n)return;if(state.token)req(`/notification/notifications/${id}/read`,{method:'PATCH'}).catch(()=>{});n.read=true;updateBadges();if(n.resourceType==='APPLICATION')openScreen('applicationDetail',n.resourceId);else if(n.resourceType==='INTERVIEW'){let iv=(data('interviews')||[]).find(x=>String(x.id)===String(n.resourceId));if(iv)openScreen('applicationDetail',iv.applicationId);else toast(n.message||n.title)}else if(n.resourceType==='OFFER'){let o=(data('offers')||[]).find(x=>String(x.id)===String(n.resourceId));if(o)openScreen('applicationDetail',o.applicationId);else toast(n.message||n.title)}else toast(n.message||n.title)}
function showSaved(){state.showSavedOnly=true;state.query='';state.jobLimit=8;openScreen('jobs')}

function appCard(a){return `<div class="card" onclick="openScreen('applicationDetail',${a.id})"><div class="between"><span class="pill blue">#${a.id}</span><span class="tiny muted">${date(a.appliedAt)}</span></div><div class="jobtitle" style="margin:9px 0 3px">${esc(a.jobTitle)}</div><div class="jobmeta">${esc(a.departmentName||'')}</div><div class="divider"></div><div class="between">${pill(a.currentStageType)}<span class="link">Chi tiết →</span></div></div>`}
function interviewCard(iv){let a=(data('apps')||[]).find(x=>x.id===iv.applicationId);return `<div class="card" onclick="openScreen('interviewDetail',${iv.id})"><div class="row"><div class="dateTile" style="width:53px;height:58px;border-radius:14px;background:var(--mint);display:grid;place-content:center;text-align:center;color:var(--green);flex-shrink:0"><b style="font-size:9px">${new Date(iv.scheduledAt).toLocaleDateString('vi-VN',{month:'short'}).toUpperCase()}</b><strong style="font-size:20px">${new Date(iv.scheduledAt).getDate()}</strong></div><div class="grow"><div class="jobtitle">${esc(a?.jobTitle||'Phỏng vấn')}</div><div class="jobmeta">${date(iv.scheduledAt)} · ${time(iv.scheduledAt)} · ${iv.durationMinutes||60} phút</div><div class="jobmeta">${iv.format==='ONLINE'?'Trực tuyến':'Trực tiếp'}</div></div>${pill(iv.status)}</div>${iv.status==='HM_CONFIRMED'&&new Date(iv.scheduledAt)>new Date()?`<div class="divider"></div><div class="between"><span class="sub">Đang chờ bạn xác nhận</span><button class="btn sm" onclick="event.stopPropagation();openScreen('interviewDetail',${iv.id})">Phản hồi</button></div>`:''}</div>`}
function notiCard(n){let icon=n.type?.includes('INTERVIEW')?'▦':n.type?.includes('OFFER')?'✉':'▤';return `<div class="notification ${!n.read?'unread':''}" onclick="openNotification(${n.id})"><div class="listicon">${icon}</div><div class="grow"><b>${esc(n.title||'Thông báo')}</b><p>${esc(n.message||'')}</p><time>${dt(n.createdAt)}</time></div></div>`}
function timelineFor(a){let t=a.currentStageType;let map={APPLIED:0,CV_SCREENING:1,HR_SCREENING:1,TECHNICAL_INTERVIEW:2,HR_INTERVIEW:2,FINAL_INTERVIEW:2,OFFER:3,HIRED:3};if(['REJECTED','WITHDRAWN'].includes(t))return `<div class="step done"><b>Đã nộp hồ sơ</b><span>${date(a.appliedAt)}</span></div><div class="step current"><b>${t==='WITHDRAWN'?'Đã rút đơn':'Không tiếp tục'}</b><span>${esc(a.rejectionReasonName||a.currentStageName||'Hồ sơ đã kết thúc')}</span></div>`;let labels=['Đã nộp hồ sơ','Sàng lọc hồ sơ','Phỏng vấn','Kết quả'];let cur=map[t]??1;return labels.map((l,i)=>`<div class="step ${i<cur||t==='HIRED'?'done':i===cur?'current':''}"><b>${i===cur&&t!=='HIRED'?esc(a.currentStageName||l):t==='HIRED'&&i===3?'Đã trúng tuyển':l}</b><span>${i===0?date(a.appliedAt):i<cur||t==='HIRED'?'Đã qua':i===cur?'Đang ở bước này':'Chưa đến'}</span></div>`).join('')}
function authView(title,desc,mode){let common=`<div class="authscreen"><div class="authlogo">A</div><div class="eyebrow">ATS CAREER · CANDIDATE</div><h1>${title}</h1><p>${desc}</p>`;if(mode==='login')return common+`<div class="field"><label>Email</label><input class="input" id="authEmail" type="email" placeholder="email@example.com"></div><div class="field"><label>Mật khẩu</label><input class="input" id="authPassword" type="password" placeholder="Nhập mật khẩu"></div><div style="text-align:right;margin:-4px 0 16px"><button class="link" onclick="openScreen('forgot')">Quên mật khẩu?</button></div><button class="btn full" onclick="login()">Đăng nhập</button><div class="authlinks">Chưa có tài khoản? <button onclick="openScreen('register')">Đăng ký ứng viên</button></div></div>`;if(mode==='register')return common+`<div class="field"><label>Họ và tên *</label><input class="input" id="regName" placeholder="Nguyễn Văn An"></div><div class="field"><label>Email *</label><input class="input" id="regEmail" type="email" placeholder="email@example.com"></div><div class="field"><label>Số điện thoại</label><input class="input" id="regPhone" placeholder="09xx xxx xxx"></div><div class="field"><label>Mật khẩu *</label><input class="input" id="regPass" type="password" placeholder="Ít nhất 8 ký tự"></div><div class="field"><label>Xác nhận mật khẩu *</label><input class="input" id="regConfirm" type="password" placeholder="Nhập lại mật khẩu"></div><label class="checkline"><input type="checkbox" id="regConsent"> Tôi đồng ý cho doanh nghiệp xử lý dữ liệu cá nhân phục vụ tuyển dụng.</label><button class="btn full" onclick="register()">Tạo tài khoản</button><div class="authlinks">Đã có tài khoản? <button onclick="openScreen('login')">Đăng nhập</button></div></div>`;if(mode==='verify')return common+`<div class="field"><label>Địa chỉ email</label><input class="input" id="verifyEmail" type="email" value="${esc(state.pendingEmail)}" placeholder="email@example.com"></div><label style="font-size:10px;font-weight:700">Mã xác minh 6 chữ số</label><div class="otp">${Array.from({length:6},(_,i)=>`<input maxlength="1" inputmode="numeric" class="otpbox" data-i="${i}" oninput="otpMove(this)" aria-label="Số ${i+1}">`).join('')}</div><button class="btn full" onclick="verifyEmail()">Xác minh email</button><div class="authlinks"><button onclick="resendOtp()">Gửi lại mã xác minh</button></div></div>`;if(mode==='forgot')return common+`<div class="field"><label>Email đăng ký</label><input class="input" id="forgotEmail" type="email" placeholder="email@example.com"></div><button class="btn full" onclick="forgotPassword()">Gửi hướng dẫn</button><div class="authlinks"><button onclick="openScreen('login')">Quay lại đăng nhập</button></div></div>`;return common+`<div class="field"><label>Email</label><input class="input" id="resetEmail" type="email" value="${esc(state.pendingResetEmail)}" placeholder="email@example.com"></div><div class="field"><label>Mã OTP (6 số)</label><input class="input" id="resetOtp" inputmode="numeric" maxlength="6" placeholder="000000"></div><div class="field"><label>Mật khẩu mới</label><input class="input" id="resetPass" type="password" placeholder="Ít nhất 8 ký tự"></div><button class="btn full" onclick="resetPassword()">Đặt lại mật khẩu</button></div>`}
function refreshJobList(){let jobs=(data('jobs')||[]).filter(j=>{let q=state.query.toLowerCase();return(!q||[j.title,j.departmentName,j.workLocationName,j.experienceRequired].join(' ').toLowerCase().includes(q))&&(!state.filter.type||j.employmentTypeName===state.filter.type)&&(!state.filter.location||j.workLocationName?.includes(state.filter.location))&&(!state.filter.arrangement||j.workArrangement===state.filter.arrangement)});$('#joblist').innerHTML=jobs.length?jobs.map(jobCard).join(''):`<div class="empty"><b>Không có kết quả</b><p>Thử thay đổi từ khóa hoặc bộ lọc.</p></div>`}
function resetFilters(){state.filter={type:'',location:'',arrangement:''};state.filterApplied=false;state.query='';render()}
function showSaved(){let jobs=(data('jobs')||[]).filter(j=>state.saved.includes(j.id));$('#joblist').innerHTML=jobs.length?jobs.map(jobCard).join(''):'<div class="empty"><b>Chưa lưu việc làm</b><p>Nhấn biểu tượng trái tim để lưu vị trí bạn quan tâm.</p></div>';$('#joblist').scrollIntoView({behavior:'smooth'})}
function filterApps(which,el){$$('.chips .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');let apps=data('apps')||[];if(which==='active')apps=apps.filter(a=>!['REJECTED','WITHDRAWN','HIRED'].includes(a.currentStageType));if(which==='closed')apps=apps.filter(a=>['REJECTED','WITHDRAWN','HIRED'].includes(a.currentStageType));$('#appsList').innerHTML=apps.length?apps.map(appCard).join(''):'<div class="empty"><b>Không có hồ sơ trong nhóm này</b></div>'}
function filterInterviews(which,el){$$('.chips .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');let all=data('interviews')||[];let finished=['EVALUATION_PENDING','COMPLETED','NO_SHOW','CANCELLED','EXPIRED'];let up=all.filter(x=>{let end=new Date(x.scheduledAt||0).getTime()+(x.durationMinutes||0)*60000;return end>=Date.now()&&!finished.includes(x.status)});let arr=which==='up'?up:all.filter(x=>!up.includes(x));$('#interviewList').innerHTML=arr.length?arr.map(interviewCard).join(''):'<div class="empty"><b>Không có lịch trong mục này</b></div>'}
function filterNoti(which,el){$$('.chips .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');let arr=data('notifications')||[];if(which==='unread')arr=arr.filter(x=>!x.read);$('#notiList').innerHTML=arr.length?arr.map(notiCard).join(''):'<div class="empty"><b>Không có thông báo</b></div>'}
function openNotification(id){let n=(data('notifications')||[]).find(x=>x.id===id);if(!n)return;if(state.token)req(`/notification/notifications/${id}/read`,{method:'PATCH'}).catch(()=>{});n.read=true;updateBadges();if(n.resourceType==='APPLICATION')openScreen('applicationDetail',n.resourceId);else if(n.resourceType==='INTERVIEW')openScreen('interviewDetail',n.resourceId);else if(n.resourceType==='OFFER')openScreen('offerDetail',n.resourceId);else toast(n.message||n.title)}
async function markAllRead(){if(state.token)try{await req('/notification/notifications/read-all',{method:'PATCH'})}catch(e){return toast(e.message,true)}(data('notifications')||[]).forEach(x=>x.read=true);render();toast('Đã đánh dấu tất cả là đã đọc')}
function openModal(type){state.modal=type;let m=$('#modalroot');let body='';if(type==='filters')body=`<div class="modal"><div class="modalhandle"></div><h3>Bộ lọc việc làm</h3><p>Thu hẹp kết quả theo nhu cầu của bạn.</p><div class="field"><label>Loại công việc</label><select class="select" id="fType"><option value="">Tất cả</option>${[...new Set((data('jobs')||[]).map(j=>j.employmentTypeName).filter(Boolean))].map(x=>`<option ${state.filter.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Địa điểm</label><select class="select" id="fLocation"><option value="">Tất cả địa điểm</option>${[...new Set((data('jobs')||[]).map(j=>j.workLocationName).filter(Boolean))].map(x=>`<option ${state.filter.location===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Hình thức làm việc</label><select class="select" id="fArrangement"><option value="">Tất cả</option><option value="ONSITE" ${state.filter.arrangement==='ONSITE'?'selected':''}>Tại văn phòng</option><option value="HYBRID" ${state.filter.arrangement==='HYBRID'?'selected':''}>Hybrid</option><option value="REMOTE" ${state.filter.arrangement==='REMOTE'?'selected':''}>Từ xa</option></select></div><div class="row"><button class="btn ghost full" onclick="closeModal();resetFilters()">Đặt lại</button><button class="btn full" onclick="applyFilters()">Xem kết quả</button></div></div>`;if(type==='withdraw')body=`<div class="modal"><div class="modalhandle"></div><h3>Rút đơn ứng tuyển?</h3><p>Hành động này sẽ chuyển hồ sơ sang trạng thái đã rút và không thể hoàn tác. Bạn có chắc chắn muốn tiếp tục?</p><div class="row"><button class="btn ghost full" onclick="closeModal()">Giữ hồ sơ</button><button class="btn danger full" onclick="withdrawApp()">Xác nhận rút đơn</button></div></div>`;if(type==='declineInterview')body=`<div class="modal"><div class="modalhandle"></div><h3>Phản hồi lịch phỏng vấn</h3><p>Bạn có thể xin dời lịch nếu vẫn quan tâm vị trí, hoặc rút đơn nếu không muốn tiếp tục.</p><div class="field"><label class="checkline"><input type="radio" name="ivChoice" value="reschedule" checked onchange="$('#ivReasonWrap').classList.remove('hide');$('#ivAction').textContent='Gửi yêu cầu dời lịch';$('#ivAction').className='btn full'"> Tôi muốn xin dời lịch</label><label class="checkline"><input type="radio" name="ivChoice" value="withdraw" onchange="$('#ivReasonWrap').classList.add('hide');$('#ivAction').textContent='Rút đơn ứng tuyển';$('#ivAction').className='btn danger full'"> Tôi không tham gia nữa và muốn rút đơn</label></div><div class="field" id="ivReasonWrap"><label>Lý do xin dời lịch *</label><textarea id="interviewReason" class="textarea" maxlength="500" placeholder="Ví dụ: Tôi có lịch công tác đột xuất..."></textarea></div><div class="row"><button class="btn ghost full" onclick="closeModal()">Để sau</button><button id="ivAction" class="btn full" onclick="declineInterview()">Gửi yêu cầu dời lịch</button></div></div>`;if(type==='declineOffer')body=`<div class="modal"><div class="modalhandle"></div><h3>Từ chối thư mời</h3><p>Bạn có thể chia sẻ lý do để nhà tuyển dụng ghi nhận phản hồi của mình.</p><div class="field"><label>Lý do (không bắt buộc)</label><select class="select" id="declineReason"><option value="">Chọn lý do</option><option>Lý do cá nhân</option><option>Đã nhận lời mời khác</option><option>Chưa phù hợp về thu nhập</option><option>Thời gian bắt đầu chưa phù hợp</option></select></div><div class="field"><label>Ghi chú thêm</label><textarea id="declineNote" class="textarea" placeholder="Chia sẻ thêm nếu cần..."></textarea></div><div class="row"><button class="btn ghost full" onclick="closeModal()">Quay lại</button><button class="btn danger full" onclick="declineOffer()">Xác nhận từ chối</button></div></div>`;if(type==='privacy')body=`<div class="modal"><div class="modalhandle"></div><h3>Quyền riêng tư & dữ liệu</h3><p>Yêu cầu xóa sẽ xóa mềm hồ sơ ứng viên và thông tin cá nhân khỏi hệ thống. Các đơn đang xét sẽ không được tiếp tục. Không thể hoàn tác.</p><label class="checkline"><input type="checkbox" id="deleteAgree"> Tôi hiểu và muốn yêu cầu xóa hồ sơ cá nhân.</label><button class="btn danger full" onclick="deleteProfile()">Gửi yêu cầu xóa hồ sơ</button><button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Hủy</button></div>`;m.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()">${body}</div>`}
function closeModal(){$('#modalroot').innerHTML='';state.modal=null}function applyFilters(){state.filter={type:$('#fType').value,location:$('#fLocation').value,arrangement:$('#fArrangement').value};state.filterApplied=true;closeModal();render()}
function startApply(id){state.selectedJob=(data('jobs')||[]).find(x=>x.id===id);if(!state.profile?.resumeUploaded){toast('Bạn cần tải CV lên hồ sơ trước khi ứng tuyển.',true);openScreen('profile');return}openScreen('apply')}
async function submitApply(){let src=Number($('#applySource').value),consent=$('#applyConsent').checked,note=$('#applyNote').value;if(!src)return toast('Vui lòng chọn nguồn tuyển dụng.',true);if(!consent)return toast('Bạn cần đồng ý xử lý dữ liệu cá nhân để nộp hồ sơ.',true);if(state.token){try{let a=await req('/application/applications',{method:'POST',body:JSON.stringify({jobPostingId:state.selectedJob.id,recruitmentSourceId:src,note:note||undefined,consentAccepted:true})});state.apps=await req('/application/applications/my');toast('Đã nộp hồ sơ thành công');state.selectedApp=a;openScreen('applicationDetail',a.id);return}catch(e){return toast(e.message,true)}}let j=state.selectedJob;let a={id:Date.now(),jobPostingId:j.id,jobTitle:j.title,departmentName:j.departmentName,currentStageName:'Đã tiếp nhận',currentStageType:'APPLIED',currentStageOrder:1,appliedAt:new Date().toISOString(),resumeUrl:state.profile?.resumeUrl};state.apps=[a,...(data('apps')||[])];toast('Đã gửi hồ sơ (chế độ demo)');state.selectedApp=a;openScreen('applicationDetail',a.id)}
async function withdrawApp(){let a=state.selectedApp;try{if(state.token)await req(`/application/applications/my/${a.id}/withdraw`,{method:'PATCH'});a.currentStageType='WITHDRAWN';a.currentStageName='Ứng viên tự rút hồ sơ';closeModal();toast('Đã rút đơn ứng tuyển');render()}catch(e){toast(e.message,true)}}
async function confirmInterview(id){try{if(state.token)await req(`/interview/interviews/${id}/confirm`,{method:'PATCH'});let iv=(data('interviews')||[]).find(x=>x.id===id);iv.status='CANDIDATE_CONFIRMED';iv.candidateConfirmed=true;toast('Đã xác nhận tham gia phỏng vấn');render()}catch(e){toast(e.message,true)}}
async function declineInterview(){let choice=$('input[name="ivChoice"]:checked')?.value||'reschedule';let reason=$('#interviewReason')?.value.trim()||'';let iv=state.selectedInterview;try{if(choice==='withdraw'){if(state.token)await req(`/application/applications/my/${iv.applicationId}/withdraw`,{method:'PATCH'});let a=(data('apps')||[]).find(x=>x.id===iv.applicationId);if(a){a.currentStageType='WITHDRAWN';a.currentStageName='Đã rút đơn'}toast('Đã rút đơn ứng tuyển');}else{if(!reason)return toast('Vui lòng nhập lý do xin dời lịch.',true);if(state.token)await req(`/interview/interviews/${iv.id}/candidate-decline`,{method:'PATCH',body:JSON.stringify({reason})});iv.status='CANDIDATE_DECLINED';iv.candidateDeclineReason=reason;toast('Đã gửi yêu cầu dời lịch')}closeModal();render()}catch(e){toast(e.message,true)}}
async function acceptOffer(id){if(!confirm('Bạn xác nhận chấp nhận thư mời nhận việc?'))return;try{if(state.token)await req(`/offer/offers/${id}/accept`,{method:'PATCH'});let o=(data('offers')||[]).find(x=>x.id===id);o.status='ACCEPTED';toast('Bạn đã chấp nhận thư mời');openScreen('welcome')}catch(e){toast(e.message,true)}}
async function declineOffer(){let o=state.selectedOffer,reason=$('#declineReason').value,note=$('#declineNote').value;try{if(state.token)await req(`/offer/offers/${o.id}/decline`,{method:'PATCH',body:JSON.stringify({note:[reason,note].filter(Boolean).join(' · ')||undefined})});o.status='DECLINED';o.declineNote=[reason,note].filter(Boolean).join(' · ');closeModal();toast('Đã gửi phản hồi từ chối thư mời');render()}catch(e){toast(e.message,true)}}
async function downloadOffer(id){try{if(!state.token)return toast('Tải PDF cần kết nối backend và đăng nhập.',true);let blob=await req(`/offer/offers/${id}/pdf`);let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`thu-moi-${id}.pdf`;a.click();URL.revokeObjectURL(url)}catch(e){toast(e.message,true)}}
async function uploadResume(input){let file=input.files[0];if(!file)return;if(file.size>10*1024*1024)return toast('CV tối đa 10 MB.',true);if(!/\.(pdf|doc|docx)$/i.test(file.name))return toast('Chỉ nhận PDF, DOC hoặc DOCX.',true);try{if(state.token){let fd=new FormData();fd.append('file',file);let p=await req('/candidate/me/resume',{method:'POST',body:fd});state.profile=p}else{state.profile.resumeUploaded=true;state.profile.resumeUrl='/files/'+file.name;state.profile.resumeUploadedAt=new Date().toISOString()}toast('Đã cập nhật CV');render()}catch(e){toast(e.message,true)}input.value=''}
async function saveProfile(){let p=data('profile'),name=$('#pName').value.trim();if(name.length<2)return toast('Họ tên phải có ít nhất 2 ký tự.',true);let skillIds=$$('.skillcheck:checked').map(x=>Number(x.value));let body={fullName:name,phone:$('#pPhone').value.trim()||undefined,dateOfBirth:$('#pDob').value||undefined,gender:$('#pGender').value||undefined,currentPosition:$('#pPosition').value.trim()||undefined,address:$('#pAddress').value.trim()||undefined,educationLevelId:$('#pEducation').value?Number($('#pEducation').value):undefined,skillIds};try{if(state.token){state.profile=await req('/candidate/me',{method:'PATCH',body:JSON.stringify(body)})}else{Object.assign(p,body);p.educationLevelName=(data('education')||[]).find(x=>x.id===body.educationLevelId)?.name;p.skillNames=(data('skills')||[]).filter(x=>skillIds.includes(x.id)).map(x=>x.name)}toast('Đã lưu hồ sơ');openScreen('profile')}catch(e){toast(e.message,true)}}
async function deleteProfile(){if(!$('#deleteAgree').checked)return toast('Vui lòng xác nhận trước khi gửi yêu cầu.',true);try{if(state.token)await req('/candidate/me/request-deletion',{method:'POST'});closeModal();state.token='';localStorage.removeItem('atsToken');toast('Đã gửi yêu cầu xóa hồ sơ');openScreen('login')}catch(e){toast(e.message,true)}}
function signOut(){if(state.token)req('/auth/logout',{method:'POST',body:JSON.stringify({refreshToken:state.refresh})}).catch(()=>{});state.token='';state.refresh='';localStorage.removeItem('atsToken');localStorage.removeItem('atsRefresh');state.profile=null;toast('Đã đăng xuất');openScreen('login')}
async function login(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('Vui lòng nhập email và mật khẩu.',true);try{let r=await req('/auth/login',{method:'POST',body:JSON.stringify({email,password}),auth:false});state.token=r.accessToken;state.refresh=r.refreshToken;localStorage.setItem('atsToken',state.token);localStorage.setItem('atsRefresh',state.refresh);let claims=JSON.parse(atob(state.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(claims.role!=='CANDIDATE'){state.token='';return toast('Tài khoản này không có vai trò CANDIDATE.',true)}await loadAll();state.stack=[];openScreen('home');toast('Đăng nhập thành công')}catch(e){toast(e.message,true)}}
async function register(){let fullName=$('#regName').value.trim(),email=$('#regEmail').value.trim(),phone=$('#regPhone').value.trim(),password=$('#regPass').value,confirmPassword=$('#regConfirm').value,consent=$('#regConsent').checked;if(fullName.length<2||!email||password.length<8||password.length>72||password!==confirmPassword||!consent)return toast('Kiểm tra họ tên, email, mật khẩu (8–72 ký tự), xác nhận mật khẩu và đồng ý dữ liệu.',true);try{await req('/auth/register',{method:'POST',body:JSON.stringify({fullName,email,phone:phone||undefined,password,confirmPassword,consentAccepted:true}),auth:false});state.pendingEmail=email;openScreen('verify');toast('Đăng ký thành công. Kiểm tra email để lấy OTP.')}catch(e){toast(e.message,true)}}
function otpMove(el){el.value=el.value.replace(/\D/g,'').slice(-1);let n=Number(el.dataset.i);if(el.value&&n<5)$$('.otpbox')[n+1].focus()}
async function verifyEmail(){let email=$('#verifyEmail').value.trim(),otpCode=$$('.otpbox').map(x=>x.value).join('');if(!/^\d{6}$/.test(otpCode))return toast('Mã OTP phải gồm đúng 6 chữ số.',true);try{await req('/auth/verify-email',{method:'POST',body:JSON.stringify({email,otpCode}),auth:false});toast('Email đã được xác minh');openScreen('login')}catch(e){toast(e.message,true)}}
async function resendOtp(){let email=$('#verifyEmail').value.trim();try{await req('/auth/resend-otp',{method:'POST',body:JSON.stringify({email}),auth:false});toast('Đã yêu cầu gửi lại mã OTP')}catch(e){toast(e.message,true)}}
async function forgotPassword(){let email=$('#forgotEmail').value.trim();if(!email)return toast('Nhập email đăng ký.',true);try{await req('/auth/forgot-password',{method:'POST',body:JSON.stringify({email}),auth:false});state.pendingResetEmail=email;openScreen('reset');toast('Nếu email tồn tại, hướng dẫn sẽ được gửi đến hộp thư.')}catch(e){toast(e.message,true)}}
async function resetPassword(){let email=$('#resetEmail').value.trim(),otpCode=$('#resetOtp').value,newPassword=$('#resetPass').value;if(!/^\d{6}$/.test(otpCode)||newPassword.length<8||newPassword.length>72)return toast('OTP phải đủ 6 số; mật khẩu từ 8–72 ký tự.',true);try{await req('/auth/reset-password',{method:'POST',body:JSON.stringify({email,otpCode,newPassword}),auth:false});toast('Đã đặt lại mật khẩu');openScreen('login')}catch(e){toast(e.message,true)}}
function init(){let clock=()=>$('#clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});clock();setInterval(clock,30000);if(state.token){$('#apiToken').value=state.token;loadAll().then(()=>openScreen('home')).catch(()=>{state.demo=true;render()})}else{state.profile=clone(demo.profile);state.jobs=clone(demo.jobs);state.apps=clone(demo.apps);state.interviews=clone(demo.interviews);state.offers=clone(demo.offers);state.notifications=clone(demo.notifications);state.sources=clone(demo.sources);state.education=clone(demo.education);state.skills=clone(demo.skills);render()} }
init();
</script>
</body></html>
