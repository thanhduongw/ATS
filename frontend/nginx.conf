# conf.d/*.conf duoc include trong http {} nen dat map o day la hop le.

# Cho phep WebSocket upgrade di xuyen qua; request thuong se gui "Connection: close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# $http_host giu ca port cong khai (vd "localhost:5173"), $server_port chi la port
# nginx lang nghe ben trong container (80) nen khong dung duoc cho X-Forwarded-Port.
map $http_host $forwarded_port {
    default                     80;
    "~^[^:]+:(?<host_port>\d+)$" $host_port;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # REST cong khai + duoc bao ve, va toan bo buoc Google OAuth2
    # (/api/auth/oauth2/pre-login, /api/auth/oauth2/authorization/google,
    #  /api/auth/login/oauth2/code/google) — tat ca deu di qua api-gateway,
    # nen X-User-* do client tu gui luon bi gateway xoa.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;

        # Giu nguyen host + port cong khai de auth-service sinh dung redirect/cookie
        # cho OAuth session. $host se cat mat port, $http_host thi khong.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
    }

    # SockJS/STOMP cua notification-service: browser -> nginx -> api-gateway -> notification.
    # Bao gom ca handshake HTTP fallback (/ws/info, /ws/<server>/<session>/xhr*)
    # lan WebSocket upgrade (/ws/<server>/<session>/websocket).
    # Khong publish port 8086 ra host.
    location /ws/ {
        proxy_pass http://api-gateway:8080/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        # STOMP heartbeat la 10s; timeout phai du dai de ket noi khong bi cat oan,
        # va tat buffering cho xhr-streaming fallback.
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
