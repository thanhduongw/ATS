server:
  port: 8085

spring:
  application:
    name: interview-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_interview
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password

services:
  auth-service:
    url: ${SERVICES_AUTH_SERVICE_URL:http://localhost:8081}
  masterdata-service:
    url: ${SERVICES_MASTERDATA_SERVICE_URL:http://localhost:8082}
  recruitment-service:
    url: ${SERVICES_RECRUITMENT_SERVICE_URL:http://localhost:8083}
  candidate-service:
    url: ${SERVICES_CANDIDATE_SERVICE_URL:http://localhost:8084}
  application-service:
    url: ${SERVICES_APPLICATION_SERVICE_URL:http://localhost:8089}