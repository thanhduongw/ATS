server:
  port: 8085

spring:
  application:
    name: interview-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_interview
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password

services:
  auth-service:
    url: http://localhost:8081
  masterdata-service:
    url: http://localhost:8082
  recruitment-service:
    url: http://localhost:8083
  candidate-service:
    url: http://localhost:8084