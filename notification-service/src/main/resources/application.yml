server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_notification
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password

services:
  auth-service:
    url: ${SERVICES_AUTH_SERVICE_URL:http://localhost:8081}
  interview-service:
    url: ${SERVICES_INTERVIEW_SERVICE_URL:http://localhost:8085}
  candidate-service:
    url: ${SERVICES_CANDIDATE_SERVICE_URL:http://localhost:8084}
  application-service:
    url: ${SERVICES_APPLICATION_SERVICE_URL:http://localhost:8089}

app:
  jwt:
    secret: ${JWT_SECRET:thay-bang-chuoi-bi-mat-it-nhat-256-bit-truoc-khi-deploy-thuc-te}
  notification:
    interview-reminder-hours-before: 1
    evaluation-check-hours-after: 24