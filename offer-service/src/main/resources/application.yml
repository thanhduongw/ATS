server:
  port: 8090

spring:
  application:
    name: offer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_offer
    username: ats_user
    password: ats_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: ats_user
    password: ats_password

services:
  auth-service:
    url: ${SERVICES_AUTH_SERVICE_URL:http://localhost:8081}
  masterdata-service:
    url: ${SERVICES_MASTERDATA_SERVICE_URL:http://localhost:8082}
  candidate-service:
    url: ${SERVICES_CANDIDATE_SERVICE_URL:http://localhost:8084}
  application-service:
    url: ${SERVICES_APPLICATION_SERVICE_URL:http://localhost:8089}
  recruitment-service:
    url: ${SERVICES_RECRUITMENT_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api/offer/v3/api-docs
